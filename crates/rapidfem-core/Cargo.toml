[package]
name = "rapidfem-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Solver-agnostic substrate: mesh, quadrature, material data model.
# Shared by the frequency-domain (rapidfem-fd) and time-domain
# (rapidfem-td) backends.

[dependencies]
# The sparse direct solver (real and complex-symmetric LDLᵀ), vendored from
# https://github.com/milanofthe/rslab (see vendor/rslab/Cargo.toml header).
# `tuning` provides the hardware probe for the a-priori RAM gate and the
# batched-solve gate in linalg.rs.
rslab = { path = "../../vendor/rslab", features = ["tuning"] }
# Small dense eigenproblems only (the Krylov-projected matrices of the
# eigenmode and port-mode solvers); every sparse solve goes through rslab.
faer = { version = "0.24", default-features = false, features = ["std"] }
# The mesh topology (edges, faces, incidences) of rapidmesh's solver
# interface, std-only without its mesher feature; vendored from
# https://github.com/milanofthe/rapidmesh.
rapidmesh-topo = { path = "../../vendor/rapidmesh/crates/rapidmesh-topo" }
hashbrown = "0.16.1"
num-complex = "0.4.6"
