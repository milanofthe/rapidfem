[package]
name = "rapidfem-fd"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Frequency-domain Nédélec-FEM solver.

[lib]
# Doc comments carry explanatory math (indented formula blocks), not runnable
# examples, this is an internal crate, the public API is the Python layer.
doctest = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rapidfem-core = { path = "../rapidfem-core" }
# Small dense eigenproblem of the eigenmode Lanczos tridiagonal; every sparse
# solve goes through rslab (rapidfem_core::linalg).
faer = { version = "0.24.0", default-features = false, features = ["std"] }
hashbrown = "0.16.1"
num-complex = "0.4.6"
rayon = { version = "1.11.0", optional = true }
web-time = "1.1"

[lints]
workspace = true
