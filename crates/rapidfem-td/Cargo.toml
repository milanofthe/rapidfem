[package]
name = "rapidfem-td"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Time-domain DGTD solver. See issue #27.

[lib]
# Doc comments carry explanatory math, not runnable examples.
doctest = false

[dependencies]
# Dense eigensolver for the cavity resonances.
faer = { version = "0.24", default-features = false, features = ["std"] }
num-complex = "0.4.6"
opencl3 = { version = "0.12.3", optional = true }
rapidfem-core = { path = "../rapidfem-core" }
rayon = "1.11.0"
# Spectra of the transfer function.
realfft = "3.5"

[features]
# Optional OpenCL GPU backend. Off by default; the CPU path is unaffected.
# OpenCL is loaded at runtime via the ICD loader, so this adds no build-time
# toolkit dependency.
gpu = ["dep:opencl3"]

[[example]]
name = "gpu_bench"
required-features = ["gpu"]
