[package]
name = "rapidfem-python"
version = "0.23.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "rapidfem"
crate-type = ["cdylib"]

[dependencies]
rapidfem-core = { path = "../crates/rapidfem-core" }
rapidfem-fd = { path = "../crates/rapidfem-fd" }
rapidfem-td = { path = "../crates/rapidfem-td", features = ["gpu"] }
rapidfem-geom = { path = "../crates/rapidfem-geom", features = ["python"] }
# float_roundtrip: exact float parsing (the stack JSON round-trips)
serde_json = { version = "1", features = ["float_roundtrip"] }
rapidmesh = { path = "../vendor/rapidmesh/crates/rapidmesh" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
num-complex = "0.4.6"

[lints]
workspace = true
